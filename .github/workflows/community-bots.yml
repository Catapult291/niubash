name: community-bots

on:
  schedule:
    - cron: "30 20 * * *" # daily 20:30 UTC — stale sweep, off busy hours
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # P0/P1 priorities are exempt from both operations
          exempt-issue-labels: "P0-critical,P1-high"
          exempt-pr-labels: "P0-critical,P1-high"
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "此 ISSUE 60 天无活动。若仍复现/仍需要，请回复以保持打开；14 天后无活动将自动关闭。"
          stale-pr-message: "此 PR 60 天无活动，14 天后将自动关闭；如继续请 rebase 或评论。"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          operations-per-run: 200
  greet:
    # Greet actual first-time contributors with a precise, fail-closed check.
    # Replaces actions/first-interaction, whose first-time detection misfired
    # and greeted the repo owner on their own bug reports (six greetings on
    # 2026-10-22) — its API lookup silently treats rate-limit/abuse failures
    # as "no prior contributions". Here: exact total_count via the search
    # API, maintainers excluded up front, and ANY API error skips the
    # greeting (never greet on uncertainty).
    if: >
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'opened')
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MAINTAINERS: "caomengxuan666"
          ISSUE_MESSAGE: "欢迎！这是你在本仓库的第一个 ISSUE 🎉 维护者会尽快跟进；报 bug 请附 `niu --version`、系统平台与最小复现脚本。"
          PR_MESSAGE: "欢迎！这是你的第一个 PR 🎉 请确认已跑过本地测试套件；CI 通过后维护者会 review。"
        run: |
          set -euo pipefail
          for m in $MAINTAINERS; do
            if [ "$AUTHOR" = "$m" ]; then
              echo "maintainer $AUTHOR — no greeting"
              exit 0
            fi
          done
          # Exact prior-contribution count (issues + PRs). The author's own
          # current record is included, so first-time means total_count <= 1.
          total=$(gh api "search/issues" \
            -f q="repo:${GITHUB_REPOSITORY} author:${AUTHOR}" \
            --jq '.total_count' 2>/dev/null) || {
            echo "contribution lookup failed — skipping greeting (fail-closed)"
            exit 0
          }
          case "$total" in
            ''|*[!0-9]*) echo "unexpected lookup result — skipping"; exit 0 ;;
          esac
          if [ "$total" -le 1 ]; then
            echo "first-time contributor $AUTHOR (total=$total) — greeting"
            if [ -n "${GITHUB_EVENT_ISSUE:-}" ] || [ "${{ github.event_name }}" = "issues" ]; then
              gh issue comment "$NUMBER" --body "$ISSUE_MESSAGE"
            else
              gh pr comment "$NUMBER" --body "$PR_MESSAGE"
            fi
          else
            echo "not first-time (total=$total) — no greeting"
          fi
