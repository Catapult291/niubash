name: eco-harvest-ci

# 采集安全化（#213）：不可信资产测试在一次性 ephemeral runner 上执行，
# 宿主机零暴露。harvest（纯 API 索引）在 ubuntu 上跑，test 需要真实
# ConPTY + GNU bash 对照，跑在 windows-latest 上。#409：runner 没有 WSL
# 发行版，oracle 改接 Git for Windows 自带的 usr/bin/bash.exe（msys bash
# 5.2.x，随 MinGit/GfW 分发，无需安装）；oracle 的 kind+版本随 build
# identity 落进每条 verdict。

on:
  schedule:
    - cron: "30 21 * * *" # nightly 21:30 UTC，错开 perfbudget 的 03:23
  workflow_dispatch:
    inputs:
      tier:
        description: "harvest 层级: t1|t2|t3|t4|t5|all"
        default: "all"
      test_tiers:
        description: "test 层级（windows runner）"
        default: "all"
      test_limit:
        description: "每轮最多测试资产数"
        default: "400"
      stale_limit:
        description: "未测/暂态之后，最多重测旧版本资产数"
        default: "80"
      test_seconds:
        description: "测试派发时间预算（秒；到期等待在途完成）"
        default: "2400"
      redo:
        description: "重测已有 verdict 的资产（--redo，用于验证取数链路）"
        default: "false"

permissions:
  contents: write # 推 state 回 data 分支

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: restore state from data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: eco-harvest-state
          path: eco-restore
      # #357: the persisted surface is state + MANIFEST. Restoring only the
      # cursor meant every run rebuilt a fresh "当夜增量" corpus (1571 assets)
      # while the 10k-asset local master corpus never reached CI.
      - name: seed state
        run: |
          mkdir -p eco/state eco/manifest
          if [ -d eco-restore/state ]; then cp -r eco-restore/state/. eco/state/; fi
          if [ -d eco-restore/manifest ]; then cp -r eco-restore/manifest/. eco/manifest/; fi
      - name: harvest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/harvest/eco-harvest.py \
            --tier "${{ github.event.inputs.tier || 'all' }}" \
            --manifest-dir eco/manifest --state-dir eco/state
      - name: upload manifest + state
        uses: actions/upload-artifact@v4
        with:
          name: eco-manifest
          path: |
            eco/manifest
            eco/state
      # Run-to-run accumulation, verifiable: the next run restores what this
      # one committed (assets must be monotonically non-decreasing).
      - name: persist state + manifest to data branch
        run: |
          cd eco
          git init -q -b eco-harvest-state .
          git config user.name "eco-bot"
          git config user.email "actions@github.com"
          git add state manifest
          git commit -qm "state+manifest: ${{ github.event.inputs.tier || 'all' }} @ $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" eco-harvest-state:eco-harvest-state

  test:
    needs: harvest
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4 # niubash：eco 脚本 + the shell under test
      # The sibling path matters: Cargo.toml patches rubash to ../rubash
      # (same step the main ci.yml windows job uses).
      - name: clone rubash as the ../rubash sibling dependency
        run: git clone --depth 1 --branch master https://github.com/${{ github.repository_owner }}/rubash.git "${{ github.workspace }}/../rubash"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps
        run: pip install pyte pywinpty # pywinpty 提供的模块名就是 winpty
      # #409: locate the GNU oracle up front and print its version — msys
      # bash 5.2.x from Git for Windows (preinstalled on the runner). Fail
      # soft, but never silently: a missing oracle means HANG/ERROR-STORM
      # rows go unexplained and the tester's #409 gate fails the job.
      - name: locate GNU oracle (Git for Windows usr/bin/bash.exe)
        id: gnu
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path
          cands = []
          override = os.environ.get("ECO_GNU_BASH", "").strip()
          if override:
              cands.append(Path(override))
          roots = [Path(os.environ[n]) for n in ("ProgramFiles", "ProgramFiles(x86)")
                   if os.environ.get(n)]
          local = os.environ.get("LOCALAPPDATA")
          if local:
              roots.append(Path(local) / "Programs")
          cands.extend(root / "Git" / "usr" / "bin" / "bash.exe" for root in roots)
          try:
              where = subprocess.run(["where.exe", "git"], capture_output=True,
                                     text=True, timeout=15)
              cands.extend(Path(line.strip()).parent.parent / "usr" / "bin" / "bash.exe"
                           for line in (where.stdout or "").splitlines() if line.strip())
          except (OSError, subprocess.TimeoutExpired):
              pass
          bash = next((c for c in cands if c.is_file()), None)
          if bash is None:
              print("::warning::no Git for Windows usr/bin/bash.exe found — "
                    "GNU oracle falls back to WSL-or-nothing; HANG/ERROR-STORM "
                    "without an oracle will fail this job (#409)")
          else:
              ver = subprocess.run([str(bash), "--version"], capture_output=True,
                                   text=True, timeout=30).stdout.splitlines()[0]
              print(f"GNU oracle (msys): {bash} :: {ver}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"bash={bash}\n")
      - name: safe scheduling and migration fixtures (no asset execution)
        run: python -m unittest discover -s scripts/harvest -p "test_*.py" -v
      - name: build engine
        run: cargo build --release --manifest-path "${{ github.workspace }}/../rubash/Cargo.toml"
      # The interactive lane needs the SHELL, not just the engine: rubash's
      # bash.exe is a shim that resolves niu.exe and execs it, so a runner
      # with no niu.exe exits 127 on every asset ("bash shim: cannot locate
      # niu.exe"). Build the host from this checkout and drive niu.exe
      # directly, exactly like the local lane's --niu target/debug/niu.exe.
      - name: build niubash (the shell under test)
        run: cargo build --release --locked
      - name: locate binaries
        id: bins
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, checkout in (("niu", root), ("rubash", root.parent / "rubash")):
                  binary = checkout / "target" / "release" / (name + ".exe")
                  if not binary.is_file():
                      raise SystemExit(f"missing binary: {binary}")
                  revision = subprocess.check_output(
                      ["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip()
                  output.write(f"{name}={binary}\n{name}_revision={revision}\n")
      - name: download manifest
        uses: actions/download-artifact@v4
        with: { name: eco-manifest, path: eco }
      - name: run tester (untrusted assets, ephemeral runner)
        shell: python {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECO_TEST_TIERS: ${{ github.event.inputs.test_tiers || 'all' }}
          ECO_TEST_LIMIT: ${{ github.event.inputs.test_limit || '400' }}
          ECO_STALE_LIMIT: ${{ github.event.inputs.stale_limit || '80' }}
          ECO_TEST_SECONDS: ${{ github.event.inputs.test_seconds || '2400' }}
          ECO_REDO: ${{ github.event.inputs.redo || 'false' }}
          ECO_NIU: ${{ steps.bins.outputs.niu }}
          ECO_RUBASH: ${{ steps.bins.outputs.rubash }}
          ECO_NIU_REVISION: ${{ steps.bins.outputs.niu_revision }}
          ECO_RUBASH_REVISION: ${{ steps.bins.outputs.rubash_revision }}
          ECO_GNU_BASH: ${{ steps.gnu.outputs.bash }}
        run: |
          import os
          import subprocess
          import sys
          command = [sys.executable, "scripts/harvest/eco-test.py",
                     "--manifest-dir", "eco/manifest", "--results-dir", "eco/results",
                     "--cache-dir", "eco/cache", "--tmp-root", "eco/tmp"]
          for flag, key in (("tiers", "ECO_TEST_TIERS"), ("limit", "ECO_TEST_LIMIT"),
                            ("stale-limit", "ECO_STALE_LIMIT"), ("max-seconds", "ECO_TEST_SECONDS"),
                            ("niu", "ECO_NIU"), ("rubash", "ECO_RUBASH"),
                            ("niu-revision", "ECO_NIU_REVISION"), ("rubash-revision", "ECO_RUBASH_REVISION")):
              command.extend(["--" + flag, os.environ[key]])
          if os.environ["ECO_REDO"] == "true":
              command.append("--redo")
          sys.exit(subprocess.call(command))
          # exit 3 = fetch gate tripped (#356/#408): FETCH-FAILED > 15%;
          # exit 4 = unexplained-failure gate tripped (#409): HANG/ERROR-STORM
          # with no oracle available to explain them. Either way the job goes
          # red instead of shipping a green shell around a dead tier.
      - name: upload verdicts
        if: always() # audit lane keeps the partials even when the gate trips
        uses: actions/upload-artifact@v4
        with:
          name: eco-results-${{ github.run_id }}
          path: eco/results
      # #357: verdicts land in the manifest DB, so persist it next to the
      # cursor — otherwise every run re-tests the whole restored corpus,
      # because eco-results itself never survives to the following run.
      - name: persist manifest verdicts to data branch
        if: always()
        shell: bash # same dialect as the harvest job's persist step
        run: |
          if [ ! -f eco/manifest/eco-manifest.sqlite ]; then
            echo "no manifest in this job (tester never reached the DB) — skipping"
            exit 0
          fi
          cd eco
          git init -q -b eco-harvest-state .
          git config user.name "eco-bot"
          git config user.email "actions@github.com"
          git add state manifest
          git commit -qm "manifest+verdicts: ${{ github.event.inputs.test_tiers || 'all' }} @ $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" eco-harvest-state:eco-harvest-state
